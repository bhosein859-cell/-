<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>گره‌گشا — گره‌ای که باز می‌شود و به چرخه‌ی حل مسئله بدل می‌گردد</title>

  <!-- ═══ چرخه‌ی چهارگانه‌ی بیرونی (نماد چرخه PDCA) — آبی نفتی ═══ -->
  <g fill="none" stroke="#1E3A8A" stroke-width="36" stroke-linecap="round">
    <!-- ربع پایین‌راست -->
    <path d="M 454 282 A 200 200 0 0 1 282 454"/>
    <!-- ربع پایین‌چپ -->
    <path d="M 230 454 A 200 200 0 0 1 58 282"/>
    <!-- ربع بالا-چپ -->
    <path d="M 58 230 A 200 200 0 0 1 230 58"/>
    <!-- ربع بالا-راست -->
    <path d="M 282 58 A 200 200 0 0 1 454 230"/>
  </g>

  <!-- ═══ گره مرکزی در حال باز شدن — نارنجی ═══ -->
  <g fill="none" stroke="#F97316" stroke-width="30">
    <!-- سه حلقه‌ی درهم‌تنیده (گره کور = مسئله) -->
    <circle cx="256" cy="302" r="62"/>
    <circle cx="216" cy="233" r="62"/>
    <circle cx="296" cy="233" r="62"/>
    <!-- رشته‌ای که از گره رها می‌شود و از شکاف چرخه بیرون می‌رود (راه‌حل) -->
    <path d="M 350 226 C 410 195 435 250 500 238" stroke-linecap="round"/>
  </g>

  <!-- نقطه‌ی پایانی رشته‌ی رهاشده -->
  <circle cx="500" cy="238" r="14" fill="#F97316"/>
</svg>
