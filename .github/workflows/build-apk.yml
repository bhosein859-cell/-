# ساخت خودکار فایل نصبی گره‌گشا در گیت‌هاب — بدون نیاز به نصب محلی
# خروجی: فایل GerehGosha-1.0.0.apk در بخش Artifacts هر اجرا
name: ساخت فایل نصبی اندروید

on:
  workflow_dispatch:   # اجرای دستی از تب Actions
  push:
    branches:
      - main
      - 'arena/**'     # اجازه‌ی ساخت روی شاخه‌های کاری

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: نمایش نسخه‌ی فلاتر
        run: flutter --version

      - name: ساخت اسکلت اندروید
        run: flutter create --platforms=android --org ir.bakhtiari --project-name gereh_gosha .

      - name: تنظیم مانیفست و Gradle اندروید
        run: python3 tool/ci_patch_android.py

      - name: دریافت وابستگی‌ها
        run: flutter pub get

      - name: بررسی ایستای کد (فقط گزارش)
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          echo "analyze_exit=$?"
          echo "### flutter analyze" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^\s+(error|warning) " analyze.log | head -n 200 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          MSG=$(grep -E "^\s+error " analyze.log | sed -e 's/%/%25/g' | tail -n 300 | cut -c1-50000 | tr '\n' '~' )
          echo "::warning title=تحلیل ایستا (خطاها)::${MSG}"

      - name: ساخت آیکون اپ
        run: dart run flutter_launcher_icons

      - name: ساخت نسخه‌ی انتشار
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: گزارش خطا (در صورت شکست)
        if: failure()
        run: |
          set +e
          LOG=$(ls -1 build.log analyze.log 2>/dev/null)
          for f in $LOG; do
            echo "### $f — ۸۰ خط آخر" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          echo "### نسخه‌های کتابخانه‌های کلیدی" >> $GITHUB_STEP_SUMMARY
          grep -E "^  (fl_chart|flutter_svg|vector_graphics|excel|pdf|archive|file_picker|speech_to_text|flutter_local_notifications|image_picker|share_plus|qr_flutter|encrypt|package_info_plus|shared_preferences|sqflite|intl|path_provider|flutter_riverpod):" -A1 pubspec.lock >> $GITHUB_STEP_SUMMARY || true
          if [ -f pubspec.lock ]; then
            DEPS=$(grep -E "^  (fl_chart|flutter_svg|vector_graphics):" -A2 pubspec.lock | grep -E "version|fl_chart|flutter_svg|vector_graphics" | tr '\n' ' ')
            echo "::notice title=نسخه‌ها::${DEPS}"
          fi
          if [ -f build.log ]; then
            # کل بخش خطاهای کامپایلر (انتهای لاگ) را گزارش کن
            MSG=$(tail -c 55000 build.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=خطای ساخت APK::${MSG}"
          fi

      - name: تغییر نام خروجی
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/GerehGosha-1.0.0.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: GerehGosha-1.0.0
          path: dist/GerehGosha-1.0.0.apk
          if-no-files-found: error
