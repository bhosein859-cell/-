# ساخت خودکار فایل نصبی گره‌گشا در گیت‌هاب — بدون نیاز به نصب محلی
# خروجی: فایل GerehGosha-1.0.0.apk در بخش Artifacts هر اجرا
name: ساخت فایل نصبی اندروید

on:
  workflow_dispatch:   # اجرای دستی از تب Actions
  push:
    branches:
      - main
      - 'arena/**'     # اجازه‌ی ساخت روی شاخه‌های کاری

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: نمایش نسخه‌ی فلاتر
        run: flutter --version

      - name: ساخت اسکلت اندروید
        run: flutter create --platforms=android --org ir.bakhtiari --project-name gereh_gosha .

      - name: تنظیم مانیفست و Gradle اندروید
        run: python3 tool/ci_patch_android.py

      - name: دریافت وابستگی‌ها
        run: flutter pub get

      - name: بررسی ایستای کد (فقط گزارش)
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          echo "exit=$?"
          tail -n 40 analyze.log >> $GITHUB_STEP_SUMMARY

      - name: ساخت آیکون اپ
        run: dart run flutter_launcher_icons

      - name: ساخت نسخه‌ی انتشار
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: گزارش خطا (در صورت شکست)
        if: failure()
        run: |
          set +e
          LOG=$(ls -1 build.log analyze.log 2>/dev/null)
          for f in $LOG; do
            echo "### $f — ۸۰ خط آخر" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          if [ -f build.log ]; then
            MSG=$(tail -n 80 build.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' | cut -c1-20000)
            echo "::error title=خطای ساخت APK::${MSG}"
          fi
          if [ -f build.log ]; then
            python3 - <<'PY' || true
          import json, os, urllib.request
          body = "```\n" + "\n".join(open("build.log", encoding="utf-8", errors="replace").read().splitlines()[-400:]) + "\n```"
          body = body[:65000]
          req = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "ci",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print("commit comment:", r.status)
          PY
          fi

      - name: تغییر نام خروجی
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/GerehGosha-1.0.0.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: GerehGosha-1.0.0
          path: dist/GerehGosha-1.0.0.apk
          if-no-files-found: error
